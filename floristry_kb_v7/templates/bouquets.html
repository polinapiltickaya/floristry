{% extends "base.html" %}
{% block title %}Букеты — ФЛОРИСТИКА{% endblock %}

{% block content %}
<h1 class="page-heading">Букеты</h1>

<div class="grid-cards">
  {% for b in bouquets %}
  <div class="card">
    <a class="card-link" href="{{ url_for('bouquet_detail', bouquet_id=b.bouquet_id) }}">
      <img src="/{{ b.image_url or 'static/img/placeholder.svg' }}"
           onerror="this.src='{{ url_for('static', filename='img/placeholder.svg') }}'"
           alt="{{ b.name }}">
      <div class="card-body">
        <h2 class="card-title">{{ b.name }}</h2>
        <div class="badges">
          {% if b.style %}<span class="badge">Стиль: {{ b.style }}</span>{% endif %}
        </div>
        <p style="margin:0; font-size:0.92rem;">{{ b.description }}</p>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
