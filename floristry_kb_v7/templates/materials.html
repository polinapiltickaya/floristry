{% extends "base.html" %}
{% block title %}Материалы — ФЛОРИСТИКА{% endblock %}

{% block content %}
<h1 class="page-heading">Материалы</h1>

<div class="grid-cards">
  {% for r in resources %}
  {% set thumb = youtube_thumb(r.url) %}
  <div class="card">
    <a class="media-card-link" href="{{ r.url }}" target="_blank" rel="noopener noreferrer">
      {% if thumb %}
        <div class="yt-thumb-wrap">
          <img src="{{ thumb }}" alt="{{ r.title }}">
          <div class="yt-play-badge"></div>
        </div>
      {% endif %}
      <div class="card-body">
        <div class="badges">
          <span class="badge">{{ r.type }}</span>
          {% if r.topic %}<span class="badge">{{ r.topic }}</span>{% endif %}
        </div>
        <h2 class="card-title" style="font-size:1rem;">{{ r.title }}</h2>
      </div>
    </a>
  </div>
  {% endfor %}
</div>
{% endblock %}
